<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - BaseLab Wholesale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <a href="/">
          <img src="images/logo.svg" alt="BaseLab Wholesale" />
        </a>
      </div>

      <h2 class="auth-title">Sign in to your account</h2>
      <p class="auth-subtitle">Welcome back! Enter your credentials.</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input
            class="form-input"
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
          />
          <span class="form-error" id="email-error"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          />
          <span class="form-error" id="password-error"></span>
        </div>

        <div class="form-row" style="justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <label class="form-checkbox">
            <input type="checkbox" id="remember" name="remember" />
            <span>Remember me</span>
          </label>
          <a href="/forgot-password.html" class="auth-link">Forgot password?</a>
        </div>

        <div class="form-error-global" id="login-error" style="display: none;"></div>

        <button type="submit" class="btn btn-primary btn-block" id="login-btn">
          Sign In
        </button>
      </form>

      <div class="auth-divider"><span>or</span></div>

      <p class="auth-footer">
        Don't have an account? <a href="/register.html" class="auth-link">Create one</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initCartDrawer();
      loadUser();

      if (getToken()) {
        window.location.href = '/';
        return;
      }

      const form = document.getElementById('login-form');
      const loginBtn = document.getElementById('login-btn');
      const loginError = document.getElementById('login-error');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const emailError = document.getElementById('email-error');
      const passwordError = document.getElementById('password-error');

      function clearErrors() {
        loginError.style.display = 'none';
        loginError.textContent = '';
        emailError.textContent = '';
        passwordError.textContent = '';
        emailInput.classList.remove('form-input-error');
        passwordInput.classList.remove('form-input-error');
      }

      function showFieldError(field, message) {
        if (field === 'email' || field === 'emailAddress') {
          emailError.textContent = message;
          emailInput.classList.add('form-input-error');
        } else if (field === 'password') {
          passwordError.textContent = message;
          passwordInput.classList.add('form-input-error');
        }
      }

      function setLoading(loading) {
        if (loading) {
          loginBtn.disabled = true;
          loginBtn.dataset.originalText = loginBtn.textContent;
          loginBtn.textContent = 'Signing in...';
        } else {
          loginBtn.disabled = false;
          loginBtn.textContent = loginBtn.dataset.originalText || 'Sign In';
        }
      }

      function getCookie(name) {
        var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
        return match ? match[2] : null;
      }

      function getNextUrl() {
        var params = new URLSearchParams(window.location.search);
        return params.get('next') || '/';
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearErrors();

        var email = emailInput.value.trim();
        var password = passwordInput.value;

        var hasError = false;
        if (!email) {
          showFieldError('email', 'Email is required.');
          hasError = true;
        }
        if (!password) {
          showFieldError('password', 'Password is required.');
          hasError = true;
        }
        if (hasError) return;

        setLoading(true);

        try {
          var data = await API.login({ email: email, password: password });
          setToken(data.accessToken);
          loadUser();

          var blSessionId = getCookie('blSessionId');
          if (blSessionId) {
            try {
              await transferCart();
            } catch (err) {
              // Cart transfer is non-critical; continue
            }
          }

          window.location.href = getNextUrl();
        } catch (err) {
          setLoading(false);

          if (err.errors && Array.isArray(err.errors)) {
            err.errors.forEach(function (error) {
              if (error.field) {
                showFieldError(error.field, error.message);
              } else {
                loginError.textContent = error.message || 'Login failed. Please try again.';
                loginError.style.display = 'block';
              }
            });
          } else {
            var message = (err && err.message) ? err.message : 'Invalid email or password. Please try again.';
            loginError.textContent = message;
            loginError.style.display = 'block';
          }
        }
      });
    });
  </script>
</body>
</html>
