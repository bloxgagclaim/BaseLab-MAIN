<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Account - BaseLab Wholesale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="/" class="header-logo">BaseLab <span>Wholesale</span></a>
    <nav class="header-nav">
      <a href="/shop.html" class="nav-link">Shop</a>
      <a href="/shop.html?category=bundles" class="nav-link">Bundles</a>
    </nav>
    <div class="header-actions">
      <div class="header-user-state"></div>
      <button class="cart-btn" onclick="openCartDrawer()">
        🛒 Cart <span class="cart-badge" style="display:none">0</span>
      </button>
    </div>
  </div>
</header>

<main class="container">
  <div class="account-layout">
    <nav class="account-nav" id="account-nav">
      <a class="active" data-tab="profile">👤 Profile</a>
      <a data-tab="orders">📋 Orders</a>
      <a data-tab="addresses">📍 Addresses</a>
      <a data-tab="wishlist">♡ Wishlist</a>
    </nav>

    <div id="account-content">
      <!-- Profile Tab -->
      <div class="account-section active" id="tab-profile">
        <h2 style="margin-bottom:24px;">My Profile</h2>
        <div id="profile-display">
          <div class="skeleton" style="height:200px;"></div>
        </div>
      </div>

      <!-- Orders Tab -->
      <div class="account-section" id="tab-orders">
        <h2 style="margin-bottom:24px;">My Orders</h2>
        <div id="orders-list">
          <div class="skeleton" style="height:100px;margin-bottom:16px;"></div>
          <div class="skeleton" style="height:100px;"></div>
        </div>
      </div>

      <!-- Addresses Tab -->
      <div class="account-section" id="tab-addresses">
        <h2 style="margin-bottom:24px;">My Addresses</h2>
        <div id="addresses-list"></div>
        <button class="btn btn-primary mt-2" id="add-address-btn" onclick="showAddressForm()">+ Add Address</button>
        <div id="address-form-wrap" style="display:none;margin-top:20px;"></div>
      </div>

      <!-- Wishlist Tab -->
      <div class="account-section" id="tab-wishlist">
        <h2 style="margin-bottom:24px;">My Wishlist</h2>
        <div id="wishlist-grid" class="product-grid"></div>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer-grid">
      <div><div class="footer-title">Company</div><div class="footer-links"><a href="#">About</a><a href="#">Careers</a><a href="#">Blog</a></div></div>
      <div><div class="footer-title">Shop</div><div class="footer-links"><a href="/shop.html">All Products</a><a href="/shop.html?category=glass">Glass</a><a href="/shop.html?category=ceramic">Ceramic</a></div></div>
      <div><div class="footer-title">Support</div><div class="footer-links"><a href="#">Contact</a><a href="#">Shipping</a><a href="#">Returns</a><a href="#">FAQ</a></div></div>
      <div><div class="footer-title">Legal</div><div class="footer-links"><a href="#">Privacy</a><a href="#">Terms</a></div></div>
    </div>
    <div class="footer-bottom"><span>&copy; 2024 BaseLab Wholesale.</span></div>
  </div>
</footer>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/store.js"></script>
<script>
const US_STATES = [
  ['AL','Alabama'],['AK','Alaska'],['AZ','Arizona'],['AR','Arkansas'],['CA','California'],
  ['CO','Colorado'],['CT','Connecticut'],['DE','Delaware'],['FL','Florida'],['GA','Georgia'],
  ['HI','Hawaii'],['ID','Idaho'],['IL','Illinois'],['IN','Indiana'],['IA','Iowa'],
  ['KS','Kansas'],['KY','Kentucky'],['LA','Louisiana'],['ME','Maine'],['MD','Maryland'],
  ['MA','Massachusetts'],['MI','Michigan'],['MN','Minnesota'],['MS','Mississippi'],['MO','Missouri'],
  ['MT','Montana'],['NE','Nebraska'],['NV','Nevada'],['NH','New Hampshire'],['NJ','New Jersey'],
  ['NM','New Mexico'],['NY','New York'],['NC','North Carolina'],['ND','North Dakota'],['OH','Ohio'],
  ['OK','Oklahoma'],['OR','Oregon'],['PA','Pennsylvania'],['RI','Rhode Island'],['SC','South Carolina'],
  ['SD','South Dakota'],['TN','Tennessee'],['TX','Texas'],['UT','Utah'],['VT','Vermont'],
  ['VA','Virginia'],['WA','Washington'],['WV','West Virginia'],['WI','Wisconsin'],['WY','Wyoming']
];

let loadedTabs = {};

document.addEventListener('DOMContentLoaded', async () => {
  initCartDrawer();
  if (!requireAuth()) return;
  await loadUser();

  onAuthChange(() => {
    if (AuthState.loaded && !AuthState.user) {
      window.location.href = '/login.html';
      return;
    }
    if (AuthState.user && !loadedTabs.profile) {
      renderProfile();
      loadedTabs.profile = true;
    }
  });

  document.querySelectorAll('#account-nav a').forEach(link => {
    link.addEventListener('click', () => switchTab(link.dataset.tab));
  });

  const hash = window.location.hash.slice(1);
  if (hash && ['profile','orders','addresses','wishlist'].includes(hash)) {
    switchTab(hash);
  }
});

function switchTab(tab) {
  document.querySelectorAll('#account-nav a').forEach(a => a.classList.toggle('active', a.dataset.tab === tab));
  document.querySelectorAll('.account-section').forEach(s => s.classList.toggle('active', s.id === 'tab-' + tab));
  window.location.hash = tab;

  if (tab === 'orders' && !loadedTabs.orders) { loadOrders(); loadedTabs.orders = true; }
  if (tab === 'addresses' && !loadedTabs.addresses) { loadAddresses(); loadedTabs.addresses = true; }
  if (tab === 'wishlist' && !loadedTabs.wishlist) { loadWishlist(); loadedTabs.wishlist = true; }
}

function renderProfile() {
  const u = AuthState.user;
  if (!u) return;
  document.getElementById('profile-display').innerHTML = `
    <div style="background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:24px;">
      <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:20px;">
        <div>
          <h3>${u.firstName || ''} ${u.lastName || ''}</h3>
          <p style="margin:0;">${u.email}</p>
          ${u.company ? '<p style="margin:4px 0 0;font-size:13px;color:var(--text-muted);">'+u.company+'</p>' : ''}
        </div>
        <button class="btn btn-sm btn-outline" onclick="toggleEditProfile()">Edit Profile</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:14px;">
        <div><span style="color:var(--text-muted);">Phone:</span> ${u.phone || 'Not set'}</div>
        <div><span style="color:var(--text-muted);">Role:</span> ${u.role}</div>
        <div><span style="color:var(--text-muted);">Member since:</span> ${u.createdAt ? new Date(u.createdAt).toLocaleDateString() : 'N/A'}</div>
      </div>
    </div>
    <div id="edit-profile-form" style="display:none;background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:24px;">
      <h4 style="margin-bottom:16px;">Edit Profile</h4>
      <form onsubmit="saveProfile(event)">
        <div class="form-row">
          <div class="form-group"><label class="form-label">First Name</label><input class="form-input" name="firstName" value="${u.firstName||''}"></div>
          <div class="form-group"><label class="form-label">Last Name</label><input class="form-input" name="lastName" value="${u.lastName||''}"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Company</label><input class="form-input" name="company" value="${u.company||''}"></div>
          <div class="form-group"><label class="form-label">Phone</label><input class="form-input" name="phone" value="${u.phone||''}"></div>
        </div>
        <div id="profile-error" class="form-error mb-1" style="display:none;"></div>
        <div style="display:flex;gap:8px;"><button type="submit" class="btn btn-primary btn-sm">Save Changes</button><button type="button" class="btn btn-outline btn-sm" onclick="toggleEditProfile()">Cancel</button></div>
      </form>
    </div>
    <div style="background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:24px;">
      <h4 style="margin-bottom:16px;">Change Password</h4>
      <form onsubmit="changePassword(event)">
        <div class="form-group"><label class="form-label">Current Password</label><input class="form-input" name="currentPassword" type="password" required></div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">New Password</label><input class="form-input" name="newPassword" type="password" required minlength="8"></div>
          <div class="form-group"><label class="form-label">Confirm New Password</label><input class="form-input" name="confirmPassword" type="password" required></div>
        </div>
        <div id="password-error" class="form-error mb-1" style="display:none;"></div>
        <div id="password-success" class="text-green mb-1" style="display:none;font-size:13px;"></div>
        <button type="submit" class="btn btn-outline btn-sm">Change Password</button>
      </form>
    </div>
  `;
}

function toggleEditProfile() {
  const el = document.getElementById('edit-profile-form');
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

async function saveProfile(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  try {
    await API.updateMe({ firstName: fd.get('firstName'), lastName: fd.get('lastName'), company: fd.get('company'), phone: fd.get('phone') });
    await loadUser();
    renderProfile();
    showToast('Profile updated');
  } catch (err) {
    document.getElementById('profile-error').textContent = err.message;
    document.getElementById('profile-error').style.display = 'block';
  }
}

async function changePassword(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const errEl = document.getElementById('password-error');
  const sucEl = document.getElementById('password-success');
  errEl.style.display = 'none'; sucEl.style.display = 'none';

  if (fd.get('newPassword') !== fd.get('confirmPassword')) {
    errEl.textContent = 'Passwords do not match'; errEl.style.display = 'block'; return;
  }
  try {
    await API.changePassword({ currentPassword: fd.get('currentPassword'), newPassword: fd.get('newPassword') });
    sucEl.textContent = 'Password changed successfully'; sucEl.style.display = 'block';
    e.target.reset();
  } catch (err) {
    errEl.textContent = err.message; errEl.style.display = 'block';
  }
}

async function loadOrders() {
  const el = document.getElementById('orders-list');
  try {
    const res = await API.getOrders();
    if (!res.orders.length) {
      el.innerHTML = '<div style="text-align:center;padding:40px;"><p style="font-size:48px;margin-bottom:12px;">📋</p><p>No orders yet.</p><a href="/shop.html" class="btn btn-primary mt-2">Start Shopping</a></div>';
      return;
    }
    el.innerHTML = res.orders.map(o => `
      <div class="order-card">
        <div class="order-card-header">
          <span class="order-number">${o.uuid}</span>
          <span class="status-badge status-${o.status}">${o.status}</span>
        </div>
        <div style="font-size:13px;color:var(--text-muted);">${new Date(o.createdAt).toLocaleDateString()} &middot; ${o.itemCount} items &middot; ${o.paymentMethod}</div>
        <div class="order-card-footer">
          <span style="font-weight:700;">$${o.total.toFixed(2)}</span>
          <button class="btn btn-sm btn-outline" onclick="viewOrder('${o.uuid}')">View Details</button>
        </div>
        <div id="order-detail-${o.uuid}" style="display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);"></div>
      </div>
    `).join('');
  } catch (err) {
    el.innerHTML = '<p class="text-red">Failed to load orders.</p>';
  }
}

async function viewOrder(uuid) {
  const el = document.getElementById('order-detail-' + uuid);
  if (el.style.display !== 'none') { el.style.display = 'none'; return; }
  el.innerHTML = '<div class="skeleton" style="height:100px;"></div>';
  el.style.display = 'block';
  try {
    const o = await API.getOrder(uuid);
    el.innerHTML = `
      <table style="width:100%;font-size:14px;margin-bottom:12px;">
        <thead><tr style="border-bottom:1px solid var(--border);"><th style="text-align:left;padding:6px 0;">Item</th><th>Qty</th><th style="text-align:right;">Price</th><th style="text-align:right;">Total</th></tr></thead>
        <tbody>${o.items.map(i => `<tr><td style="padding:6px 0;">${i.name}</td><td style="text-align:center;">${i.qty}</td><td style="text-align:right;">$${i.price.toFixed(2)}</td><td style="text-align:right;">$${i.lineTotal.toFixed(2)}</td></tr>`).join('')}</tbody>
      </table>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:13px;">
        <div>
          <strong>Ship to:</strong><br>
          ${o.shipping.firstName} ${o.shipping.lastName}<br>
          ${o.shipping.company ? o.shipping.company + '<br>' : ''}
          ${o.shipping.street}<br>
          ${o.shipping.city}, ${o.shipping.state} ${o.shipping.zip}
        </div>
        <div>
          <div style="display:flex;justify-content:space-between;"><span>Subtotal:</span><span>$${o.subtotal.toFixed(2)}</span></div>
          <div style="display:flex;justify-content:space-between;"><span>Shipping:</span><span>$${o.shippingCost.toFixed(2)}</span></div>
          <div style="display:flex;justify-content:space-between;"><span>Tax:</span><span>$${o.tax.toFixed(2)}</span></div>
          ${o.discount > 0 ? '<div style="display:flex;justify-content:space-between;color:var(--green);"><span>Discount:</span><span>-$'+o.discount.toFixed(2)+'</span></div>' : ''}
          <div style="display:flex;justify-content:space-between;font-weight:700;border-top:1px solid var(--border);padding-top:6px;margin-top:6px;"><span>Total:</span><span>$${o.total.toFixed(2)}</span></div>
        </div>
      </div>
      ${o.trackingNumber ? '<p style="margin-top:12px;font-size:13px;">Tracking: <strong>'+o.trackingNumber+'</strong></p>' : ''}
      ${o.status === 'pending' ? '<button class="btn btn-sm btn-danger mt-2" onclick="cancelOrder(\''+uuid+'\')">Cancel Order</button>' : ''}
    `;
  } catch (err) {
    el.innerHTML = '<p class="text-red">Failed to load order details.</p>';
  }
}

async function cancelOrder(uuid) {
  if (!confirm('Cancel this order?')) return;
  try {
    await API.cancelOrder(uuid);
    showToast('Order cancelled');
    loadedTabs.orders = false;
    loadOrders();
  } catch (e) { showToast(e.message, 'error'); }
}

async function loadAddresses() {
  const el = document.getElementById('addresses-list');
  try {
    const addresses = await API.getAddresses();
    if (!addresses.length) {
      el.innerHTML = '<p style="color:var(--text-muted);">No saved addresses.</p>';
      return;
    }
    el.innerHTML = addresses.map(a => `
      <div class="address-card ${a.isDefault ? 'default' : ''}">
        <div style="display:flex;justify-content:space-between;align-items:start;">
          <div>
            <strong>${a.firstName} ${a.lastName}</strong> ${a.isDefault ? '<span class="address-default-badge">Default</span>' : ''}
            ${a.company ? '<br><span style="font-size:13px;color:var(--text-muted);">'+a.company+'</span>' : ''}
            <br><span style="font-size:14px;">${a.street}<br>${a.city}, ${a.state} ${a.zip}</span>
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-sm btn-outline" onclick="editAddress(${a.id})">Edit</button>
            <button class="btn btn-sm btn-outline" onclick="deleteAddress(${a.id})" style="color:var(--red);">Delete</button>
          </div>
        </div>
      </div>
    `).join('');
  } catch (err) {
    el.innerHTML = '<p class="text-red">Failed to load addresses.</p>';
  }
}

function showAddressForm(addr) {
  const wrap = document.getElementById('address-form-wrap');
  const stateOptions = US_STATES.map(([v,l]) => `<option value="${v}" ${addr && addr.state===v?'selected':''}>${l}</option>`).join('');
  wrap.style.display = 'block';
  wrap.innerHTML = `
    <div style="background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:24px;">
      <h4 style="margin-bottom:16px;">${addr ? 'Edit Address' : 'Add New Address'}</h4>
      <form onsubmit="saveAddress(event, ${addr ? addr.id : 'null'})">
        <div class="form-row">
          <div class="form-group"><label class="form-label">First Name *</label><input class="form-input" name="firstName" required value="${addr?addr.firstName:''}"></div>
          <div class="form-group"><label class="form-label">Last Name *</label><input class="form-input" name="lastName" required value="${addr?addr.lastName:''}"></div>
        </div>
        <div class="form-group"><label class="form-label">Company</label><input class="form-input" name="company" value="${addr?addr.company||'':''}"></div>
        <div class="form-group"><label class="form-label">Street *</label><input class="form-input" name="street" required value="${addr?addr.street:''}"></div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">City *</label><input class="form-input" name="city" required value="${addr?addr.city:''}"></div>
          <div class="form-group"><label class="form-label">State *</label><select class="form-input" name="state" required><option value="">Select</option>${stateOptions}</select></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">ZIP *</label><input class="form-input" name="zip" required value="${addr?addr.zip:''}"></div>
          <div class="form-group"><label class="form-label">Country</label><input class="form-input" name="country" value="${addr?addr.country:'US'}" readonly></div>
        </div>
        <label class="form-checkbox mb-2"><input type="checkbox" name="isDefault" ${addr&&addr.isDefault?'checked':''}> Set as default address</label>
        <div id="addr-error" class="form-error mb-1" style="display:none;"></div>
        <div style="display:flex;gap:8px;"><button type="submit" class="btn btn-primary btn-sm">Save</button><button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('address-form-wrap').style.display='none'">Cancel</button></div>
      </form>
    </div>
  `;
}

async function editAddress(id) {
  try {
    const addresses = await API.getAddresses();
    const addr = addresses.find(a => a.id === id);
    if (addr) showAddressForm(addr);
  } catch (e) { showToast(e.message, 'error'); }
}

async function saveAddress(e, id) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const data = {
    firstName: fd.get('firstName'), lastName: fd.get('lastName'),
    company: fd.get('company') || undefined, street: fd.get('street'),
    city: fd.get('city'), state: fd.get('state'), zip: fd.get('zip'),
    country: fd.get('country'), isDefault: !!fd.get('isDefault'),
  };
  try {
    if (id) { await API.updateAddress(id, data); }
    else { await API.addAddress(data); }
    document.getElementById('address-form-wrap').style.display = 'none';
    loadAddresses();
    showToast(id ? 'Address updated' : 'Address added');
  } catch (err) {
    document.getElementById('addr-error').textContent = err.message;
    document.getElementById('addr-error').style.display = 'block';
  }
}

async function deleteAddress(id) {
  if (!confirm('Delete this address?')) return;
  try {
    await API.deleteAddress(id);
    loadAddresses();
    showToast('Address deleted');
  } catch (e) { showToast(e.message, 'error'); }
}

async function loadWishlist() {
  const el = document.getElementById('wishlist-grid');
  try {
    const items = await API.getWishlist();
    if (!items.length) {
      el.innerHTML = '<div style="text-align:center;padding:40px;grid-column:1/-1;"><p style="font-size:48px;margin-bottom:12px;">♡</p><p>Your wishlist is empty.</p><a href="/shop.html" class="btn btn-primary mt-2">Browse Products</a></div>';
      return;
    }
    el.innerHTML = items.map(item => {
      const card = buildProductCard(item);
      return card.replace('</div>\n    </div>', `</div><button class="btn btn-sm btn-outline" style="margin:0 16px 16px;color:var(--red);" onclick="removeFromWishlist(${item.id})">Remove from Wishlist</button></div>`);
    }).join('');
  } catch (err) {
    el.innerHTML = '<p class="text-red">Failed to load wishlist.</p>';
  }
}

async function removeFromWishlist(productId) {
  try {
    await API.removeWishlist(productId);
    loadWishlist();
    showToast('Removed from wishlist');
  } catch (e) { showToast(e.message, 'error'); }
}
</script>
</body>
</html>
