<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — BaseLab Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: #1e293b; min-height: 100vh; }

    .admin-layout { display: flex; min-height: 100vh; }

    .admin-sidebar {
      width: 240px; background: #0f172a; color: #fff; padding: 0;
      display: flex; flex-direction: column; position: fixed; top: 0; left: 0;
      height: 100vh; z-index: 100; overflow-y: auto;
    }
    .admin-logo {
      padding: 24px 20px; font-size: 18px; font-weight: 800;
      letter-spacing: -0.5px; border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .admin-nav { display: flex; flex-direction: column; padding: 12px 0; }
    .admin-nav a {
      display: flex; align-items: center; gap: 10px; padding: 10px 20px;
      color: #94a3b8; text-decoration: none; font-size: 14px; font-weight: 500;
      transition: all .15s ease; border-left: 3px solid transparent;
    }
    .admin-nav a:hover { color: #e2e8f0; background: rgba(255,255,255,.04); }
    .admin-nav a.active {
      color: #fff; background: rgba(255,255,255,.08);
      border-left-color: #3b82f6;
    }

    .admin-main { flex: 1; margin-left: 240px; padding: 32px; }

    .admin-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 28px;
    }
    .admin-header h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
    .admin-header .date { color: #64748b; font-size: 14px; font-weight: 500; }

    .stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 32px; }
    .stat-card {
      background: #fff; border-radius: 12px; padding: 24px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .stat-label { font-size: 13px; font-weight: 500; color: #64748b; margin-bottom: 8px; }
    .stat-value { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
    .stat-value.revenue { color: #16a34a; }

    .section-title {
      font-size: 18px; font-weight: 700; margin-bottom: 16px;
      letter-spacing: -0.3px;
    }

    .table-wrap {
      background: #fff; border-radius: 12px; overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 32px;
    }
    .table-wrap table { width: 100%; border-collapse: collapse; }
    .table-wrap th {
      text-align: left; padding: 12px 16px; font-size: 12px; font-weight: 600;
      color: #64748b; text-transform: uppercase; letter-spacing: 0.5px;
      background: #f8fafc; border-bottom: 1px solid #e2e8f0;
    }
    .table-wrap td {
      padding: 12px 16px; font-size: 14px; border-bottom: 1px solid #f1f5f9;
    }
    .table-wrap tr:last-child td { border-bottom: none; }
    .table-wrap a { color: #3b82f6; text-decoration: none; font-weight: 600; }
    .table-wrap a:hover { text-decoration: underline; }

    .status-badge {
      display: inline-block; padding: 4px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 600; text-transform: capitalize;
    }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-paid { background: #dbeafe; color: #1e40af; }
    .status-processing { background: #e0e7ff; color: #3730a3; }
    .status-shipped { background: #cffafe; color: #155e75; }
    .status-delivered { background: #dcfce7; color: #166534; }
    .status-cancelled { background: #fee2e2; color: #991b1b; }
    .status-refunded { background: #f3e8ff; color: #6b21a8; }

    .skeleton {
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite; border-radius: 6px;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .skeleton-row td { padding: 16px; }
    .skeleton-block { height: 16px; border-radius: 4px; }

    @media (max-width: 1024px) {
      .stat-cards { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      .admin-sidebar { width: 200px; }
      .admin-main { margin-left: 200px; padding: 20px; }
      .stat-cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-logo">BaseLab Admin</div>
      <nav class="admin-nav">
        <a href="/admin/index.html" class="active">📊 Dashboard</a>
        <a href="/admin/products.html">📦 Products</a>
        <a href="/admin/orders.html">📋 Orders</a>
        <a href="#" onclick="logout();return false;">🚪 Logout</a>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <h1>Dashboard</h1>
        <div class="date" id="current-date"></div>
      </div>

      <div class="stat-cards" id="stat-cards">
        <div class="stat-card"><div class="stat-label">Total Orders</div><div class="skeleton" style="height:32px;width:80px;"></div></div>
        <div class="stat-card"><div class="stat-label">Total Revenue</div><div class="skeleton" style="height:32px;width:120px;"></div></div>
        <div class="stat-card"><div class="stat-label">Pending Orders</div><div class="skeleton" style="height:32px;width:60px;"></div></div>
        <div class="stat-card"><div class="stat-label">Total Customers</div><div class="skeleton" style="height:32px;width:70px;"></div></div>
      </div>

      <h2 class="section-title">Recent Orders</h2>
      <div class="table-wrap" id="recent-orders-wrap">
        <table>
          <thead>
            <tr>
              <th>Order #</th>
              <th>Customer</th>
              <th>Items</th>
              <th>Total</th>
              <th>Status</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="recent-orders-body">
            <tr class="skeleton-row"><td colspan="6"><div class="skeleton skeleton-block" style="height:16px;width:100%;"></div></td></tr>
            <tr class="skeleton-row"><td colspan="6"><div class="skeleton skeleton-block" style="height:16px;width:100%;"></div></td></tr>
            <tr class="skeleton-row"><td colspan="6"><div class="skeleton skeleton-block" style="height:16px;width:100%;"></div></td></tr>
            <tr class="skeleton-row"><td colspan="6"><div class="skeleton skeleton-block" style="height:16px;width:100%;"></div></td></tr>
            <tr class="skeleton-row"><td colspan="6"><div class="skeleton skeleton-block" style="height:16px;width:100%;"></div></td></tr>
          </tbody>
        </table>
      </div>

      <h2 class="section-title">Top Products</h2>
      <div class="table-wrap" id="top-products-wrap">
        <table>
          <thead>
            <tr>
              <th>Product</th>
              <th>Category</th>
              <th>Units Sold</th>
              <th>Revenue</th>
            </tr>
          </thead>
          <tbody id="top-products-body">
            <tr class="skeleton-row"><td colspan="4"><div class="skeleton skeleton-block" style="height:16px;width:100%;"></div></td></tr>
            <tr class="skeleton-row"><td colspan="4"><div class="skeleton skeleton-block" style="height:16px;width:100%;"></div></td></tr>
            <tr class="skeleton-row"><td colspan="4"><div class="skeleton skeleton-block" style="height:16px;width:100%;"></div></td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/store.js"></script>
  <script>
    function formatCurrency(val) {
      return '$' + Number(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatDate(dateStr) {
      if (!dateStr) return '—';
      const d = new Date(dateStr);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function formatCurrentDate() {
      const now = new Date();
      return now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      requireAdmin();
      await loadUser();

      document.getElementById('current-date').textContent = formatCurrentDate();

      try {
        const data = await API.getDashboard();

        document.getElementById('stat-cards').innerHTML = `
          <div class="stat-card">
            <div class="stat-label">Total Orders</div>
            <div class="stat-value">${data.totalOrders}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total Revenue</div>
            <div class="stat-value revenue">${formatCurrency(data.totalRevenue)}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Pending Orders</div>
            <div class="stat-value">${data.pendingOrders}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total Customers</div>
            <div class="stat-value">${data.totalUsers}</div>
          </div>
        `;

        const recentBody = document.getElementById('recent-orders-body');
        if (data.recentOrders && data.recentOrders.length > 0) {
          recentBody.innerHTML = data.recentOrders.map(o => `
            <tr>
              <td><a href="/admin/orders.html?order=${o.uuid}">${o.uuid}</a></td>
              <td>${escapeHtml(o.userEmail)}</td>
              <td>${o.itemCount}</td>
              <td>${formatCurrency(o.total)}</td>
              <td><span class="status-badge status-${o.status}">${o.status}</span></td>
              <td>${formatDate(o.createdAt)}</td>
            </tr>
          `).join('');
        } else {
          recentBody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:24px;">No recent orders</td></tr>';
        }

        const topBody = document.getElementById('top-products-body');
        if (data.topProducts && data.topProducts.length > 0) {
          topBody.innerHTML = data.topProducts.map(p => `
            <tr>
              <td>${escapeHtml(p.name)}</td>
              <td style="text-transform:capitalize;">${escapeHtml(p.category || '—')}</td>
              <td>${p.unitsSold}</td>
              <td>${formatCurrency(p.revenue)}</td>
            </tr>
          `).join('');
        } else {
          topBody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#94a3b8;padding:24px;">No product data yet</td></tr>';
        }
      } catch (err) {
        console.error('Dashboard load error:', err);
        document.getElementById('stat-cards').innerHTML = '<div class="stat-card" style="grid-column:1/-1;text-align:center;color:#dc2626;">Failed to load dashboard data. Please try again.</div>';
      }
    });

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>

</body>
</html>
