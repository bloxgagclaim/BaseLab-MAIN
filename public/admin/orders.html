<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders — BaseLab Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: #1e293b; min-height: 100vh; }

    .admin-layout { display: flex; min-height: 100vh; }

    .admin-sidebar {
      width: 240px; background: #0f172a; color: #fff; padding: 0;
      display: flex; flex-direction: column; position: fixed; top: 0; left: 0;
      height: 100vh; z-index: 100; overflow-y: auto;
    }
    .admin-logo {
      padding: 24px 20px; font-size: 18px; font-weight: 800;
      letter-spacing: -0.5px; border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .admin-nav { display: flex; flex-direction: column; padding: 12px 0; }
    .admin-nav a {
      display: flex; align-items: center; gap: 10px; padding: 10px 20px;
      color: #94a3b8; text-decoration: none; font-size: 14px; font-weight: 500;
      transition: all .15s ease; border-left: 3px solid transparent;
    }
    .admin-nav a:hover { color: #e2e8f0; background: rgba(255,255,255,.04); }
    .admin-nav a.active {
      color: #fff; background: rgba(255,255,255,.08);
      border-left-color: #3b82f6;
    }

    .admin-main { flex: 1; margin-left: 240px; padding: 32px; }

    .admin-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px;
    }
    .admin-header h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 18px; border-radius: 8px; font-size: 14px;
      font-weight: 600; border: none; cursor: pointer;
      transition: all .15s ease; text-decoration: none;
    }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-secondary { background: #e2e8f0; color: #475569; }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-sm { padding: 6px 12px; font-size: 13px; }

    .filter-bar {
      display: flex; gap: 12px; align-items: center; margin-bottom: 16px;
    }
    .filter-bar label { font-size: 13px; font-weight: 600; color: #475569; }
    .filter-bar select {
      padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 8px;
      font-size: 14px; font-family: inherit; outline: none; background: #fff;
    }
    .filter-bar select:focus { border-color: #3b82f6; }

    .table-wrap {
      background: #fff; border-radius: 12px; overflow-x: auto;
      box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 24px;
    }
    .table-wrap table { width: 100%; border-collapse: collapse; min-width: 1000px; }
    .table-wrap th {
      text-align: left; padding: 12px 14px; font-size: 11px; font-weight: 600;
      color: #64748b; text-transform: uppercase; letter-spacing: 0.5px;
      background: #f8fafc; border-bottom: 1px solid #e2e8f0; white-space: nowrap;
    }
    .table-wrap td {
      padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
    }
    .table-wrap tr:last-child td { border-bottom: none; }
    .table-wrap tbody tr.order-row { cursor: pointer; transition: background .1s ease; }
    .table-wrap tbody tr.order-row:hover { background: #f8fafc; }

    .status-badge {
      display: inline-block; padding: 4px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 600; text-transform: capitalize;
    }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-paid { background: #dbeafe; color: #1e40af; }
    .status-processing { background: #e0e7ff; color: #3730a3; }
    .status-shipped { background: #cffafe; color: #155e75; }
    .status-delivered { background: #dcfce7; color: #166534; }
    .status-cancelled { background: #fee2e2; color: #991b1b; }
    .status-refunded { background: #f3e8ff; color: #6b21a8; }

    .order-detail {
      display: none; background: #f8fafc; border-bottom: 2px solid #e2e8f0;
    }
    .order-detail.open { display: table-row; }
    .order-detail-inner {
      padding: 24px; display: grid;
      grid-template-columns: 2fr 1fr; gap: 24px;
    }

    .detail-section { margin-bottom: 20px; }
    .detail-section:last-child { margin-bottom: 0; }
    .detail-label { font-size: 12px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }

    .items-table { width: 100%; border-collapse: collapse; }
    .items-table th {
      text-align: left; padding: 8px 10px; font-size: 11px; font-weight: 600;
      color: #64748b; text-transform: uppercase; border-bottom: 1px solid #e2e8f0;
    }
    .items-table td { padding: 8px 10px; font-size: 13px; border-bottom: 1px solid #f1f5f9; }

    .address-block { font-size: 14px; line-height: 1.6; color: #475569; }

    .totals-block { font-size: 14px; }
    .totals-row { display: flex; justify-content: space-between; padding: 4px 0; }
    .totals-row.total { font-weight: 700; font-size: 16px; border-top: 2px solid #e2e8f0; margin-top: 6px; padding-top: 8px; }

    .status-update {
      display: flex; gap: 8px; align-items: center; margin-top: 16px; flex-wrap: wrap;
    }
    .status-update select, .status-update input {
      padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 8px;
      font-size: 14px; font-family: inherit; outline: none;
    }
    .status-update select:focus, .status-update input:focus { border-color: #3b82f6; }

    .tracking-input { display: none; }
    .tracking-input.visible { display: block; }

    .pagination {
      display: flex; gap: 8px; justify-content: center; align-items: center;
      margin-top: 8px;
    }
    .pagination button {
      padding: 8px 16px; border: 1px solid #e2e8f0; border-radius: 8px;
      background: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
      font-family: inherit; color: #475569;
    }
    .pagination button:hover:not(:disabled) { background: #f1f5f9; }
    .pagination button:disabled { opacity: 0.4; cursor: default; }
    .pagination .page-info { font-size: 13px; color: #64748b; }

    .skeleton {
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite; border-radius: 6px;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .empty-state { text-align: center; padding: 40px 20px; color: #94a3b8; }

    @media (max-width: 768px) {
      .admin-sidebar { width: 200px; }
      .admin-main { margin-left: 200px; padding: 20px; }
      .order-detail-inner { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-logo">BaseLab Admin</div>
      <nav class="admin-nav">
        <a href="/admin/index.html">📊 Dashboard</a>
        <a href="/admin/products.html">📦 Products</a>
        <a href="/admin/orders.html" class="active">📋 Orders</a>
        <a href="#" onclick="logout();return false;">🚪 Logout</a>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <h1>Orders</h1>
      </div>

      <div class="filter-bar">
        <label for="status-filter">Status:</label>
        <select id="status-filter">
          <option value="">All</option>
          <option value="pending">Pending</option>
          <option value="paid">Paid</option>
          <option value="processing">Processing</option>
          <option value="shipped">Shipped</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
          <option value="refunded">Refunded</option>
        </select>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Order #</th>
              <th>Customer</th>
              <th>Date</th>
              <th>Status</th>
              <th>Items</th>
              <th>Subtotal</th>
              <th>Shipping</th>
              <th>Total</th>
              <th>Payment</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="orders-body">
            <tr><td colspan="10"><div class="skeleton" style="height:16px;width:100%;margin:8px 0;"></div></td></tr>
            <tr><td colspan="10"><div class="skeleton" style="height:16px;width:100%;margin:8px 0;"></div></td></tr>
            <tr><td colspan="10"><div class="skeleton" style="height:16px;width:100%;margin:8px 0;"></div></td></tr>
            <tr><td colspan="10"><div class="skeleton" style="height:16px;width:100%;margin:8px 0;"></div></td></tr>
            <tr><td colspan="10"><div class="skeleton" style="height:16px;width:100%;margin:8px 0;"></div></td></tr>
          </tbody>
        </table>
      </div>

      <div class="pagination" id="pagination"></div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/store.js"></script>
  <script>
    let currentPage = 1;
    let totalPages = 1;
    let expandedOrder = null;
    let ordersCache = [];

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function formatCurrency(val) {
      return '$' + Number(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatDate(dateStr) {
      if (!dateStr) return '—';
      const d = new Date(dateStr);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function formatPayment(method) {
      const map = { card: 'Card', paypal: 'PayPal', net30: 'Net 30' };
      return map[method] || method || '—';
    }

    function buildCustomerName(order) {
      if (order.userFirstName && order.userLastName) {
        return escapeHtml(order.userFirstName + ' ' + order.userLastName);
      }
      return escapeHtml(order.userEmail || order.shipping?.email || 'Guest');
    }

    function renderOrders(orders) {
      const tbody = document.getElementById('orders-body');
      ordersCache = orders;

      if (orders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" class="empty-state">No orders found</td></tr>';
        return;
      }

      let html = '';
      for (const o of orders) {
        html += `
          <tr class="order-row" data-uuid="${escapeHtml(o.uuid)}" onclick="toggleOrderDetail('${escapeHtml(o.uuid)}')">
            <td style="font-weight:600;font-family:monospace;">${escapeHtml(o.uuid)}</td>
            <td>${buildCustomerName(o)}</td>
            <td>${formatDate(o.createdAt)}</td>
            <td><span class="status-badge status-${o.status}">${o.status}</span></td>
            <td>${o.itemCount}</td>
            <td>${formatCurrency(o.subtotal)}</td>
            <td>${formatCurrency(o.shippingCost)}</td>
            <td style="font-weight:700;">${formatCurrency(o.total)}</td>
            <td>${formatPayment(o.paymentMethod)}</td>
            <td><button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();toggleOrderDetail('${escapeHtml(o.uuid)}')">View</button></td>
          </tr>
          <tr class="order-detail" id="detail-${o.uuid}">
            <td colspan="10">
              <div class="order-detail-inner" id="detail-inner-${o.uuid}">
                <div style="text-align:center;padding:24px;color:#94a3b8;">Loading order details...</div>
              </div>
            </td>
          </tr>
        `;
      }
      tbody.innerHTML = html;
    }

    async function toggleOrderDetail(uuid) {
      const detailRow = document.getElementById('detail-' + uuid);
      if (!detailRow) return;

      if (expandedOrder === uuid) {
        detailRow.classList.remove('open');
        expandedOrder = null;
        return;
      }

      if (expandedOrder) {
        const prev = document.getElementById('detail-' + expandedOrder);
        if (prev) prev.classList.remove('open');
      }

      expandedOrder = uuid;
      detailRow.classList.add('open');

      const inner = document.getElementById('detail-inner-' + uuid);
      inner.innerHTML = '<div style="text-align:center;padding:24px;color:#94a3b8;">Loading order details...</div>';

      try {
        const order = await API.getOrder(uuid);
        renderOrderDetail(uuid, order);
      } catch (err) {
        console.error('Load order detail error:', err);
        inner.innerHTML = '<div style="text-align:center;padding:24px;color:#dc2626;">Failed to load order details</div>';
      }
    }

    function renderOrderDetail(uuid, order) {
      const inner = document.getElementById('detail-inner-' + uuid);
      const items = order.items || [];
      const shipping = order.shipping || {};

      const isShipped = ['shipped'].includes(order.status);

      let itemsHtml = '';
      if (items.length > 0) {
        itemsHtml = `
          <table class="items-table">
            <thead>
              <tr><th>Name</th><th>SKU</th><th>Qty</th><th>Unit Price</th><th>Line Total</th></tr>
            </thead>
            <tbody>
              ${items.map(i => `
                <tr>
                  <td>${escapeHtml(i.name)}</td>
                  <td style="font-family:monospace;font-size:12px;color:#64748b;">${escapeHtml(i.sku)}</td>
                  <td>${i.qty}</td>
                  <td>${formatCurrency(i.price)}</td>
                  <td style="font-weight:600;">${formatCurrency(i.lineTotal)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }

      inner.innerHTML = `
        <div>
          <div class="detail-section">
            <div class="detail-label">Order Items</div>
            ${itemsHtml || '<div style="color:#94a3b8;">No items</div>'}
          </div>
        </div>
        <div>
          <div class="detail-section">
            <div class="detail-label">Shipping Address</div>
            <div class="address-block">
              ${escapeHtml(shipping.firstName || '')} ${escapeHtml(shipping.lastName || '')}<br>
              ${shipping.company ? escapeHtml(shipping.company) + '<br>' : ''}
              ${escapeHtml(shipping.street || '')}<br>
              ${escapeHtml(shipping.city || '')}, ${escapeHtml(shipping.state || '')} ${escapeHtml(shipping.zip || '')}<br>
              ${escapeHtml(shipping.country || 'US')}<br>
              ${shipping.email ? '<br>' + escapeHtml(shipping.email) : ''}
              ${shipping.phone ? '<br>' + escapeHtml(shipping.phone) : ''}
            </div>
          </div>

          <div class="detail-section">
            <div class="detail-label">Order Totals</div>
            <div class="totals-block">
              <div class="totals-row"><span>Subtotal</span><span>${formatCurrency(order.subtotal)}</span></div>
              <div class="totals-row"><span>Shipping</span><span>${formatCurrency(order.shippingCost)}</span></div>
              <div class="totals-row"><span>Tax</span><span>${formatCurrency(order.tax)}</span></div>
              ${order.discount > 0 ? '<div class="totals-row"><span>Discount' + (order.promoCode ? ' (' + escapeHtml(order.promoCode) + ')' : '') + '</span><span style="color:#16a34a;">-' + formatCurrency(order.discount) + '</span></div>' : ''}
              <div class="totals-row total"><span>Total</span><span>${formatCurrency(order.total)}</span></div>
            </div>
          </div>

          ${order.trackingNumber ? '<div class="detail-section"><div class="detail-label">Tracking Number</div><div style="font-family:monospace;font-size:14px;">' + escapeHtml(order.trackingNumber) + '</div></div>' : ''}

          <div class="detail-section">
            <div class="detail-label">Update Status</div>
            <div class="status-update">
              <select id="status-select-${uuid}">
                <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option>
                <option value="paid" ${order.status === 'paid' ? 'selected' : ''}>Paid</option>
                <option value="processing" ${order.status === 'processing' ? 'selected' : ''}>Processing</option>
                <option value="shipped" ${order.status === 'shipped' ? 'selected' : ''}>Shipped</option>
                <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                <option value="refunded" ${order.status === 'refunded' ? 'selected' : ''}>Refunded</option>
              </select>
              <input type="text" id="tracking-${uuid}" class="tracking-input ${isShipped ? 'visible' : ''}"
                placeholder="Tracking number" value="${escapeHtml(order.trackingNumber || '')}">
              <button class="btn btn-primary btn-sm" onclick="updateOrderStatus('${escapeHtml(uuid)}')">Update</button>
            </div>
          </div>
        </div>
      `;

      const statusSelect = document.getElementById('status-select-' + uuid);
      const trackingInput = document.getElementById('tracking-' + uuid);
      statusSelect.addEventListener('change', () => {
        if (statusSelect.value === 'shipped') {
          trackingInput.classList.add('visible');
        } else {
          trackingInput.classList.remove('visible');
        }
      });
    }

    async function updateOrderStatus(uuid) {
      const statusSelect = document.getElementById('status-select-' + uuid);
      const trackingInput = document.getElementById('tracking-' + uuid);
      const status = statusSelect.value;
      const trackingNumber = trackingInput.value.trim();

      const payload = { status };
      if (status === 'shipped' && trackingNumber) {
        payload.trackingNumber = trackingNumber;
      }

      try {
        await API.adminUpdateOrder(uuid, payload);
        showToast('Order ' + uuid + ' updated to ' + status);

        const badge = document.querySelector('tr[data-uuid="' + uuid + '"] .status-badge');
        if (badge) {
          badge.className = 'status-badge status-' + status;
          badge.textContent = status;
        }

        const detailRow = document.getElementById('detail-' + uuid);
        if (detailRow && detailRow.classList.contains('open')) {
          const order = await API.getOrder(uuid);
          renderOrderDetail(uuid, order);
        }
      } catch (err) {
        console.error('Update order error:', err);
        showToast(err.message || 'Failed to update order.', 'error');
      }
    }

    async function loadOrders(page, status) {
      const params = { limit: 50, page: page };
      if (status) params.status = status;

      try {
        const data = await API.adminGetOrders(params);
        currentPage = data.page;
        totalPages = data.pages;
        renderOrders(data.orders || []);
        renderPagination();
      } catch (err) {
        console.error('Load orders error:', err);
        document.getElementById('orders-body').innerHTML =
          '<tr><td colspan="10" class="empty-state" style="color:#dc2626;">Failed to load orders</td></tr>';
      }
    }

    function renderPagination() {
      const container = document.getElementById('pagination');
      if (totalPages <= 1) {
        container.innerHTML = '';
        return;
      }
      container.innerHTML = `
        <button ${currentPage <= 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})">Previous</button>
        <span class="page-info">Page ${currentPage} of ${totalPages}</span>
        <button ${currentPage >= totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})">Next</button>
      `;
    }

    function goToPage(page) {
      const status = document.getElementById('status-filter').value;
      expandedOrder = null;
      loadOrders(page, status);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      requireAdmin();
      await loadUser();

      const params = new URLSearchParams(window.location.search);
      const initialStatus = params.get('status') || '';
      if (initialStatus) {
        document.getElementById('status-filter').value = initialStatus;
      }

      await loadOrders(1, initialStatus);

      const highlightOrder = params.get('order');
      if (highlightOrder) {
        setTimeout(() => {
          toggleOrderDetail(highlightOrder);
        }, 300);
      }

      document.getElementById('status-filter').addEventListener('change', (e) => {
        expandedOrder = null;
        currentPage = 1;
        loadOrders(1, e.target.value);
      });
    });
  </script>

</body>
</html>
